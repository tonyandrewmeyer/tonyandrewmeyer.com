{{ define "main" }}
<div class="home">
  {{ with .Content }}<div class="home-intro">{{ . }}</div>{{ end }}
  <h2>Recent posts</h2>
  {{ $posts := where .Site.RegularPages "Section" "posts" }}
  <ul class="post-list">
    {{ range first 15 $posts }}
      <li>
        <a class="post-link" href="{{ .RelPermalink }}">{{ .Title }}</a>
        {{ if not .Date.IsZero }}<time class="post-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 Jan 2006" }}</time>{{ end }}
      </li>
    {{ end }}
  </ul>
  <p><a href="{{ "/archive/" | relURL }}">Full archive &rarr;</a></p>
</div>
{{ end }}
