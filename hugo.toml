baseURL = "https://tonyandrewmeyer.com/"
languageCode = "en-nz"
title = "Tony Andrew Meyer"
timeZone = "Pacific/Auckland"
enableEmoji = true

[pagination]
  pagerSize = 15

# Reproduce the WordPress permalink scheme so old links keep working.
[permalinks]
  posts = "/:year/:month/:day/:slug/"

[taxonomies]
  category = "categories"
  tag = "tags"

# Main navigation: internal sections.
[[menu.main]]
  name = "Posts"
  url = "/posts/"
  weight = 1
[[menu.main]]
  name = "Archive"
  url = "/archive/"
  weight = 2
[[menu.main]]
  name = "Tags"
  url = "/tags/"
  weight = 3

[params]
  description = "Personal blog of Tony Andrew Meyer."
  # External links (migrated from the WordPress nav menu) render in the footer.
  # See data/menu_extra.json.

# Sidebar "Elsewhere" blocks. Each service's feed is fetched at build time and a
# block only renders when its identifier below is set. The feed hosts are not
# reachable from the sandbox, so these populate on the GitHub Actions deploy.
[params.elsewhere]
  count = 4
  [params.elsewhere.goodreads]
    user_id = "2229155"  # numeric id from goodreads.com/user/show/<id>-name
    shelf = "read"
  [params.elsewhere.flickr]
    nsid = ""  # Flickr NSID (e.g. 12345678@N00); username "littlechicken" alone won't work for the feed
  [params.elsewhere.letterboxd]
    user = "tonyandrewmeyer"

[markup.goldmark.renderer]
  unsafe = true  # allow inline HTML retained from old posts

[services.rss]
  limit = 20
